[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden by DATABASE_URL when set (see alembic/env.py). This fallback
# exists so `alembic` works without env vars; keep it pointed at Postgres,
# or a stray run will create and migrate a database nothing else uses.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/agentapp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
