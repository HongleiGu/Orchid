server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /console {
        return 301 /console/;
    }

    # The service worker and manifest must always revalidate, or a deploy is
    # invisible until the old worker happens to expire.
    location ~ ^/console/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed filenames: safe to cache forever.
    location /console/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /console/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        return 404;
    }
}
