# Included in every location: nginx drops a parent's add_header directives as
# soon as a child location declares any of its own, so repeating them per
# location via this include is the only way they reliably apply.
#
# connect-src 'self' is the control that makes keeping the API key in web
# storage defensible: even if script were injected, it could not send the key to
# another origin. The console can only ever talk to the server that served it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
