services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      # Ordered mirror chains, highest priority first — each is tried in turn.
      # CN-first by default (Aliyun -> Tsinghua -> upstream); override in .env.
      args:
        PIP_INDEX_URLS: "${PIP_INDEX_URLS:-https://mirrors.aliyun.com/pypi/simple/ https://pypi.tuna.tsinghua.edu.cn/simple https://pypi.org/simple}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}"
        APT_MIRRORS: "${APT_MIRRORS:-mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn deb.debian.org}"
        NODE_MIRRORS: "${NODE_MIRRORS:-https://mirrors.aliyun.com/nodejs-release https://mirrors.tuna.tsinghua.edu.cn/nodejs-release}"
        NPM_REGISTRIES: "${NPM_REGISTRIES:-https://registry.npmmirror.com https://registry.npmjs.org}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    # Loopback only — nginx terminates TLS and proxies to these. Publishing
    # them on 0.0.0.0 would expose an unauthenticated API beside HTTPS.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentapp
      REDIS_URL: redis://redis:6379/0
      APP_CORS_ORIGINS: "${APP_CORS_ORIGINS:-http://localhost:3000}"
      VAULT_DIR: /app/vault
      STATE_DIR: /app/data/state
      # Marketplace installs shell out to npm at runtime (marketplace/service.py)
      # and walk NPM_REGISTRIES in order — mirrors must be set here, not just at
      # build. The single-value vars are the first entry of their chain.
      PIP_INDEX_URLS: "${PIP_INDEX_URLS:-https://mirrors.aliyun.com/pypi/simple/ https://pypi.tuna.tsinghua.edu.cn/simple https://pypi.org/simple}"
      PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}"
      NPM_REGISTRIES: "${NPM_REGISTRIES:-https://registry.npmmirror.com https://registry.npmjs.org}"
      npm_config_registry: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skill-runner:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/data/packages:/app/data/packages
      - ./vault:/app/vault
      - ./examples:/app/examples:ro
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped

  # ── Skill Runner (sandbox for marketplace packages + bundled skills) ─────────
  skill-runner:
    build:
      context: ./backend/skill-runner
      args:
        PIP_INDEX_URLS: "${PIP_INDEX_URLS:-https://mirrors.aliyun.com/pypi/simple/ https://pypi.tuna.tsinghua.edu.cn/simple https://pypi.org/simple}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}"
        APT_MIRRORS: "${APT_MIRRORS:-mirrors.aliyun.com mirrors.tuna.tsinghua.edu.cn deb.debian.org}"
    volumes:
      - ./backend/data/packages/node_modules:/packages/node_modules:ro
      - ./backend/app/skills/bundled:/bundled:ro
      - ./vault:/vault
      # Shared mutable state: OAuth tokens, cached IDs, etc. Backend's OAuth
      # callbacks write here; skills running in the runner read from the same
      # files. Read-write on both sides — there is no DB inside the runner.
      - ./backend/data/state:/state
    environment:
      VAULT_DIR: /vault
      STATE_DIR: /state
      # /install-deps shells out to pip at runtime and walks the same chain
      # (skill-runner/main.py).
      PIP_INDEX_URLS: "${PIP_INDEX_URLS:-https://mirrors.aliyun.com/pypi/simple/ https://pypi.tuna.tsinghua.edu.cn/simple https://pypi.org/simple}"
      PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle. Behind nginx these are the public
        # https:// / wss:// origin — set them in .env on the server.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}"
        NPM_REGISTRIES: "${NPM_REGISTRIES:-https://registry.npmmirror.com https://registry.npmjs.org}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── nginx (TLS termination + reverse proxy) ──────────────────────────────────
  # Profile-gated: plain `docker compose up` for local dev never starts these.
  # On the server put COMPOSE_PROFILES=prod in .env, or pass --profile prod.
  nginx:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
      DOMAIN_ALT: "${DOMAIN_ALT:-}"
      # Substitute only our DOMAIN* vars, never nginx runtime vars like $$host.
      NGINX_ENVSUBST_FILTER: "^DOMAIN"
    volumes:
      # templates-http (plain HTTP) or templates-tls (443 + redirect).
      - ./nginx/${NGINX_TEMPLATE_DIR:-templates-http}:/etc/nginx/templates:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    # Reload every 6h so renewed certificates are picked up without a restart.
    # The inner `/docker-entrypoint.sh nginx` call is required, not redundant:
    # the image only renders conf templates when its entrypoint is invoked with
    # "nginx" as the first argument, which overriding `command` otherwise skips.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  # ── certbot (Let's Encrypt renewal) ──────────────────────────────────────────
  # First issuance is scripts/init-letsencrypt.sh; this only renews. certbot
  # exits early unless a cert is within 30 days of expiry, so a 12h loop is cheap.
  certbot:
    image: certbot/certbot:latest
    # Its own profile: running plain HTTP should not start a renewal loop for a
    # certificate that does not exist. Enable with COMPOSE_PROFILES=prod,tls.
    profiles: ["tls"]
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    depends_on:
      - nginx
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentapp
    # Loopback only: these credentials are defaults and this host is public.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis (pub/sub + cache) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./backend/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
